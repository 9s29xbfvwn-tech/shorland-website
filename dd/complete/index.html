<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#FAFAF7">
  <title>Direct Debit confirmed | Shorland</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        linear-gradient(90deg, rgba(204,203,198,.062) 1px, transparent 1px) 0 0 / 88px 88px,
        linear-gradient(180deg, rgba(204,203,198,.054) 1px, transparent 1px) 0 0 / 88px 88px,
        #FAFAF7;
      color: #1A1A18;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
    }
    main {
      width: min(100% - 48px, 620px);
      padding: 64px 0;
    }
    .brand {
      margin: 0 0 54px;
      padding-bottom: 18px;
      border-bottom: 1px solid #CCCBC6;
      font-size: 27px;
      font-weight: 300;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 22px;
      font-size: clamp(38px, 7vw, 54px);
      font-weight: 200;
      line-height: 1.06;
    }
    p {
      max-width: 540px;
      margin: 0;
      color: #6A6866;
      font-size: 18px;
      line-height: 1.58;
    }
    a {
      display: inline-block;
      margin-top: 34px;
      color: #1A1A18;
      text-decoration: none;
      border-bottom: 1px solid #CCCBC6;
      padding-bottom: 2px;
    }
    a:hover, a:focus-visible { border-color: #1A1A18; outline: none; }
  </style>
</head>
<body>
  <main>
    <div class="brand">Shorland</div>
    <h1>Thank you.</h1>
    <p>Your Direct Debit instruction has been received. Future invoices will be collected automatically once your instruction is active.</p>
    <a href="https://www.shorland.com/">Return to Shorland</a>
  </main>
</body>
</html>
